spring:
  application:
    name: finalert.notification-service
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    listener:
      simple:
        observation-enabled: ${RABBITMQ_OBSERVATION_ENABLED:true}
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: ${RABBITMQ_CONSUMER_MAX_ATTEMPTS:5}
          initial-interval: 1s
          multiplier: 2.0
          max-interval: 30s
    template:
      observation-enabled: ${RABBITMQ_OBSERVATION_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus}
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.1}

finalert:
  rabbitmq:
    alert-triggered:
      queue-name: ${ALERT_TRIGGERED_NOTIFICATION_QUEUE:alert-triggered-notification}
      exchange-name: ${ALERT_EVENTS_EXCHANGE:alert.events}
      routing-key: ${ALERT_TRIGGERED_ROUTING_KEY:alert.triggered}
  notification:
    from-address: ${NOTIFICATION_FROM_ADDRESS:alerts@finalert.local}
