// The root project only orchestrates the independent service builds.
// Keep each service's group, version, plugins, repositories, and dependencies
// in that service's own build.gradle.

def serviceTasks = { taskName -> subprojects.collect { "${it.path}:${taskName}" } }

tasks.register('build') {
    group = 'build'
    description = 'Builds all FinAlert services.'
    dependsOn serviceTasks('build')
}

tasks.register('clean') {
    group = 'build'
    description = 'Cleans all FinAlert services.'
    dependsOn serviceTasks('clean')
}

tasks.register('check') {
    group = 'verification'
    description = 'Checks all FinAlert services.'
    dependsOn serviceTasks('check')
}

tasks.register('test') {
    group = 'verification'
    description = 'Runs tests for all FinAlert services.'
    dependsOn serviceTasks('test')
}
