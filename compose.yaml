services:
  alert-engine:
    image: 01-alert-engine-service
    build:
      context: ./01-alert-engine-service
    container_name: 01-alert-engine-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://finalert-alert-engine-postgres:5432/${ALERT_ENGINE_DB_NAME:-finalert_alert_engine}
      SPRING_DATASOURCE_USERNAME: ${ALERT_ENGINE_DB_USERNAME:-finalert_alert_engine}
      SPRING_DATASOURCE_PASSWORD: ${ALERT_ENGINE_DB_PASSWORD:-finalert-local}
      SPRING_RABBITMQ_HOST: finalert-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-finalert}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-finalert-local}
    depends_on:
      alert-engine-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  market-data-ingestion:
    image: 02-market-data-ingestion-service
    build:
      context: ./02-market-data-ingestion-service
    container_name: 02-market-data-ingestion-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      SPRING_MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-finalert}:${MONGO_INITDB_ROOT_PASSWORD:-finalert-local}@finalert-mongodb:27017/${MARKET_DATA_MONGODB_DATABASE:-finalert_market_data}?authSource=admin&uuidRepresentation=standard&replicaSet=rs0&directConnection=true
      SPRING_RABBITMQ_HOST: finalert-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-finalert}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-finalert-local}
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
  notification:
    image: 03-notification-service
    build:
      context: ./03-notification-service
    container_name: 03-notification-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://finalert-notification-postgres:5432/${NOTIFICATION_DB_NAME:-finalert_notification}
      SPRING_DATASOURCE_USERNAME: ${NOTIFICATION_DB_USERNAME:-finalert_notification}
      SPRING_DATASOURCE_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-finalert-local}
      SPRING_RABBITMQ_HOST: finalert-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-finalert}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-finalert-local}
      SPRING_MAIL_HOST: finalert-mailpit
      SPRING_MAIL_PORT: 1025
      NOTIFICATION_FROM_ADDRESS: ${NOTIFICATION_FROM_ADDRESS:-alerts@finalert.local}
    depends_on:
      notification-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
  mailpit:
    image: axllent/mailpit:v1.32.0
    container_name: finalert-mailpit
    hostname: finalert-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
  mongodb:
    image: mongo:8.3.11-noble
    container_name: finalert-mongodb
    hostname: finalert-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-finalert}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-finalert-local}
      MONGO_INITDB_DATABASE: ${MARKET_DATA_MONGODB_DATABASE:-finalert_market_data}
      MONGO_REPLICA_SET_KEY: ${MONGO_REPLICA_SET_KEY:-finalert-local-replica-set-key-change-me}
    entrypoint:
      - /bin/bash
      - -ec
      - |
        rm -f /tmp/mongodb-keyfile
        printf '%s' "$$MONGO_REPLICA_SET_KEY" | base64 | tr -d '\n' > /tmp/mongodb-keyfile
        chmod 400 /tmp/mongodb-keyfile
        chown mongodb:mongodb /tmp/mongodb-keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /tmp/mongodb-keyfile --bind_ip_all
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'try { rs.status().ok } catch (error) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"finalert-mongodb:27017\"}]}).ok }' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  alert-engine-postgres:
    image: postgres:17.11
    container_name: finalert-alert-engine-postgres
    hostname: finalert-alert-engine-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${ALERT_ENGINE_DB_NAME:-finalert_alert_engine}
      POSTGRES_USER: ${ALERT_ENGINE_DB_USERNAME:-finalert_alert_engine}
      POSTGRES_PASSWORD: ${ALERT_ENGINE_DB_PASSWORD:-finalert-local}
    volumes:
      - alert_engine_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  notification-postgres:
    image: postgres:17.11
    container_name: finalert-notification-postgres
    hostname: finalert-notification-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME:-finalert_notification}
      POSTGRES_USER: ${NOTIFICATION_DB_USERNAME:-finalert_notification}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-finalert-local}
    volumes:
      - notification_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  rabbitmq:
    image: rabbitmq:4.2.9-management
    container_name: finalert-rabbitmq
    hostname: finalert-rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-finalert}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-finalert-local}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongodb_data:
  alert_engine_postgres_data:
  notification_postgres_data:
  rabbitmq_data:
